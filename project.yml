name: TravelJournal

options:
  bundleIdPrefix: com.nehahumbe
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    # Leave empty so the project opens without a paid team; set your team in Xcode
    # (Signing & Capabilities) or here before building to a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TravelJournal:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nehahumbe.traveljournal
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Travel Journal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Fonts are not in the repo yet — drop the TTFs in Sources/Resources/Fonts/
        # and these entries will pick them up. Missing fonts fall back to system.
        UIAppFonts:
          - Caprasimo-Regular.ttf
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-Bold.ttf

  TravelJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TravelJournal
